<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Leehan · A Return Letter from the Little Fish</title>
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/192/main/result.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fffff0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family: "Yozai", system-ui, sans-serif;
  font-weight:500;
}
.stage{
  position:relative;
  width:100vw;
  height:100vh;
  max-width:960px;
  max-height:1707px;
}
.wrap{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  aspect-ratio:960/1707;
  overflow:hidden;
  background:#fffff0;
  transform-origin:top left;
}
.inner{
  position:absolute;
  top:0;
  left:0;
  width:960px;
  height:1707px;
  transform-origin:top left;
}
.bg-img{position:absolute;inset:0;z-index:0}
.bg-img img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.title-img{
  position:absolute;
  width:calc(67% - 100px);
  top:12%;
  left:50%;
  transform:translate(-50%, -2px);
  z-index:4;
  cursor:pointer;
  transition: transform 0.18s ease-out;
  touch-action: manipulation;
}
.title-img:active{
  transform: translate(-50%, -2px) scale(0.96);
}
.title-img img{width:100%;object-fit:contain;display:block}
.top-title-small{position:absolute;top:25px;left:20px;color:#555;font-size:24px;letter-spacing:1px;z-index:5}
.top-right-num{
  position:absolute;
  top:24px;
  right:32px;
  color:#555;
  font-size:21px;
  z-index:5;
  background:rgba(255,255,240,0.87);
  padding:4px 10px;
  border-radius:12px;
}
.sub-tip{
  position:absolute;
  top:366px;
  left:50%;
  transform:translateX(-50%);
  font-size:27px;
  color:#6B4F4B;
  letter-spacing:1px;
  white-space:nowrap;
  z-index:5;
}
.zero-wrap{
  position:absolute;
  top:480px;
  left:50%;
  transform:translateX(-50%);
  width:157.5px;
  z-index:4;
}
.zero-wrap img{width:100%;object-fit:contain;display:block}
.go-btn{
  position:absolute;
  right:30px;
  top:440px;
  width:76px;
  height:76px;
  transform:translateY(-50%);
  cursor:pointer;
  z-index:10;
  transition: transform 0.18s ease-out;
  touch-action: manipulation;
}
.go-btn:active{
  transform: translateY(-50%) scale(0.96);
}
.go-btn img{width:100%;height:100%;object-fit:contain;display:block}
.sticky-wrap{position:absolute;inset:0;z-index:2;overflow:hidden}
.sticker-item{
  position:absolute;
  cursor:pointer;
  transition: transform 0.18s ease-out;
  touch-action: manipulation;
}
.sticker-item:active{
  transform: scale(0.96);
}
.sticker-item img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  pointer-events: none;
}
.hh-wrap{width:362.5px;height:auto;top:611px;left:35px}
.wb-wrap{width:434px;height:auto;top:713px;right:79px}
.bqt-wrap{width:342px;height:auto;top:996px;right:538px}
.bq-wrap{width:430px;height:auto;top:925px;right:51px}
.tz-wrap{width:235px;height:auto;top:1250px;left:50%;transform:translateX(-50%)}
.tz-wrap:active{
  transform: translateX(-50%) scale(0.96) !important;
}
.fz-wrap{width:319px;height:auto;left:39px;bottom:73px;transform:scale(0.84);transform-origin:left bottom}
.mo-wrap{width:216px;height:auto;left:373px;bottom:100px;transform:scale(0.9);transform-origin:left bottom}
.ling-wrap{width:317px;height:auto;right:19px;bottom:66px;transform:scale(0.978);transform-origin:right bottom}
</style>
</head>
<body>
 <div class="stage">
  <div class="wrap">
    <div class="inner">
       <div class="bg-img">
        <img src="bg.png" alt="background" />
      </div>
       <div class="title-img">
        <img src="titel.webp" alt="Leehan" />
       </div>
       <div class="top-title-small">A Return Letter from the Little Fish</div>
      <div class="top-right-num">1020</div>
      <div class="sub-tip">*此为桐儇dm记录</div>
      <div class="zero-wrap">
        <img src="0000.png" alt="0000">
      </div>
      <a class="go-btn" href="leehan2.html">
        <img src="go.png" alt="go" />
      </a>
       <div class="sticky-wrap">
        <div class="sticker-item hh-wrap"><img src="hh.png" /></div>
        <div class="sticker-item wb-wrap"><img src="wb.png" alt="对话气泡" /></div>
        <div class="sticker-item bqt-wrap"><img src="bqt.png" /></div>
        <div class="sticker-item bq-wrap"><img src="bq.png" /></div>
        <div class="sticker-item tz-wrap"><img src="tz.png" alt="网格纸条" /></div>
        <div class="sticker-item fz-wrap"><img src="fz.png" /></div>
        <div class="sticker-item mo-wrap"><img src="mo.png" /></div>
        <div class="sticker-item ling-wrap"><img src="ling.png" /></div>
      </div>
     </div>
  </div>
</div>

<script>
const stage = document.querySelector('.stage');
const wrap = document.querySelector('.wrap');
const inner = document.querySelector('.inner');

function fit(){
  const sw = stage.clientWidth;
  const sh = stage.clientHeight;
  const scale = Math.min(sw / 960, sh / 1707);
  wrap.style.width = (960 * scale) + 'px';
  wrap.style.height = (1707 * scale) + 'px';
  wrap.style.left = ((sw - 960 * scale) / 2) + 'px';
  wrap.style.top = ((sh - 1707 * scale) / 2) + 'px';
  inner.style.transform = `scale(${scale})`;
}

fit();
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', ()=>setTimeout(fit,100));

// 核心：和你成功页面一致的结构
const soundMap = {
  titleImg: 'hlo.mp3',
  bqWrap: '400.mp3',
  fzWrap: 'od.mp3',
  moWrap: 'lp.mp3',
  lingWrap: 'love.mp3',
  tzWrap: 'gb.mp3',
  wbWrap: 'hd.mp3',
  hhWrap: 'taw.mp3',
  bqtWrap: 'sea.mp3'
};

let currentAudio = null;
let currentSrc = null;

function bindAudio(el, src){
  if(!el) return;
  el.onclick = function(){
    // 点同一个，暂停
    if(currentSrc === src){
      if(currentAudio){
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      currentAudio = null;
      currentSrc = null;
      return;
    }
    // 先停上一个
    if(currentAudio){
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
      currentSrc = null;
    }
    // 新建Audio实例（就是你那份稳定代码的写法！）
    const audio = new Audio(src);
    audio.currentTime = 0;
    audio.play().catch(e=>console.log(src, e));
    currentAudio = audio;
    currentSrc = src;

    audio.onended = function(){
      if(currentAudio === audio){
        currentAudio = null;
        currentSrc = null;
      }
    }
  }
}

bindAudio(document.querySelector('.title-img'), soundMap.titleImg);
bindAudio(document.querySelector('.bq-wrap'), soundMap.bqWrap);
bindAudio(document.querySelector('.fz-wrap'), soundMap.fzWrap);
bindAudio(document.querySelector('.mo-wrap'), soundMap.moWrap);
bindAudio(document.querySelector('.ling-wrap'), soundMap.lingWrap);
bindAudio(document.querySelector('.tz-wrap'), soundMap.tzWrap);
bindAudio(document.querySelector('.wb-wrap'), soundMap.wbWrap);
bindAudio(document.querySelector('.hh-wrap'), soundMap.hhWrap);
bindAudio(document.querySelector('.bqt-wrap'), soundMap.bqtWrap);
</script>
</body>
</html>
