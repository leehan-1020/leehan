<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>leehan2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#FFFFF0;
}

.viewport{
  width:100vw;
  height:100vh;
  position:relative;
  background:#FFFFF0;
}

.canvas{
  position:absolute;
  width:960px;
  height:1707px;
  transform-origin:0 0;
}

.xbg{
  position:absolute;
  top:0;
  left:0;
  width:960px;
  height:1707px;
  object-fit:contain;
  display:block;
}

.plate,
.mc-cup,
.home-gif,
.text-box-1,
.text-box-2{
  position:absolute;
  object-fit:contain;
}

.cake-wrap{
  position:absolute;
  width:259px;
  left:260px;
  transform:translateX(-50%);
  top:170px;
  z-index:2;
}

.cake{
  width:100%;
  cursor:pointer;
}

.plate{
  width:300px; height:300px; transform:rotate(0deg);
  left:115px; top:240px; z-index:1;
}

.mc-cup{
  width:290px; left:611px; top:539px; z-index:3; cursor:pointer;
}

.home-gif{
  width:140px; right:51px; top:45px; left:auto; z-index:3; cursor:pointer;
}

.text-box-1{
  width:448px;
  aspect-ratio:6/2;
  left:335px;
  top:270px;
  background:#FFFFE0;
  border-radius:12px;
  padding:12px;
  color:#8b7976;
  outline:none;
  border:1px solid #e2dcd0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  padding-left:115px;
}
.text-box-1 strong{
  font-size:39px;
  display:block;
  color:#8b7976;
  letter-spacing:2px;
}
.text-box-1 span{
  font-size:19px;
  margin-top:4px;
}

.text-box-2{
  width:448px;
  aspect-ratio:6/2;
  left:244px;
  top:620px;
  background:#FFFFE0;
  border-radius:12px;
  padding:12px;
  color:#8b7976;
  outline:none;
  border:1px solid #e2dcd0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  padding-left:115px;
}
.text-inner-right{
  text-align:right;
  margin-left:-41px;
}
.text-box-2 strong{
  font-size:34px;
  display:block;
  color:#8b7976;
  letter-spacing:2px;
}
.text-box-2 span{
  font-size:19px;
  margin-top:4px;
}

.click-item{
  transform-style:preserve-3d;
  transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1), filter 0.35s ease;
  transform:translateZ(0);
  filter:drop-shadow(0 10px 18px rgba(0,0,0,0.18));
}

.click-item:active{
  transform:translateZ(40px) scale(1.08);
  filter:drop-shadow(0 18px 30px rgba(0,0,0,0.35));
}

.fade-overlay{
  position:fixed; inset:0; background:#ffffff; z-index:9999;
  opacity:0; pointer-events:none; transition:opacity 0.32s ease-in-out;
}

.fade-overlay.active{ opacity:1; pointer-events:auto; }
</style>
</head>
<body>
<div class="fade-overlay" id="fadeOverlay"></div>

<div class="viewport">
  <div class="canvas" id="canvas">
    <img class="xbg" src="xbg.webp" alt="背景">

    <div class="cake-wrap">
      <img class="cake click-item" src="ck.webp" alt="蛋糕" data-link="leehan3.html">
    </div>

    <img class="plate" src="pz.webp" alt="播放器">
    <img class="mc-cup click-item" src="mc.webp" alt="杯子" data-link="cup.html">
    <img class="home-gif click-item" src="home.gif" alt="返回主页" data-link="leehan.html">

    <!-- 原来的文本框1 -->
    <div class="text-box-1">
      <strong>october</strong>
      <span>Enter the birthday month</span>
    </div>
    <!-- 新增文本框2 -->
    <div class="text-box-2">
      <div class="text-inner-right">
        <strong>December</strong>
        <span>The season of autumn grows deep</span>
      </div>
    </div>
  </div>
</div>

<script>
const canvasDom = document.getElementById('canvas');
const viewport = document.querySelector('.viewport');
const baseW = 960;
const baseH = 1707;

function resizeCanvas(){
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  const scaleW = vw / baseW;
  const scaleH = vh / baseH;
  const scale = Math.min(scaleW, scaleH);
  const offsetX = (vw - baseW * scale) / 2;
  const offsetY = (vh - baseH * scale) / 2;
  canvasDom.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(resizeCanvas,100));

const overlay = document.getElementById('fadeOverlay');
const clickItems = document.querySelectorAll('.click-item');

clickItems.forEach(item => {
  item.addEventListener('click', function () {
    const targetUrl = this.dataset.link;
    overlay.classList.add('active');
    setTimeout(() => { location.href = targetUrl; }, 320);
  });
});
</script>
</body>
</html>
