<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>leehan2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  background:#f5f1ea;
}
/* 行程页同款媒体查询，锁定960 / 1707 */
@media (max-width:767px) {
  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .page{
    position:relative;
    width:100%;
    aspect-ratio: 960 / 1707;
    overflow:hidden;
  }
}
@media (min-width:768px) {
  html,body{
    overflow-y:auto;
  }
  .page{
    position:relative;
    width:480px;
    margin:30px auto;
    height: calc(480px * 1707 / 960);
    overflow:hidden;
  }
}
/* 内层画布：固定960×1707，等比缩放填满外层page！重点！ */
.inner-canvas{
  position:absolute;
  width:960px;
  height:1707px;
  background:url("xbg.webp") no-repeat center;
  background-size:960px 1707px;
  transform-origin: top left;
}
.oct-img,
.plate,
.mc-cup,
.nov-text,
.home-gif{
  position:absolute;
  object-fit:contain;
}
/* 👇 你的原图定位，完全原样，一个数字没改！ */
.oct-img{
  width:250px; left:196px; top:260px; z-index:3;
}
.cake-wrap{
  position:absolute; width:240px; left:334px;
  transform:translateX(-50%); top:150px; z-index:2;
}
.cake{ width:100%; cursor:pointer; }
.plate{
  width:300px; height:300px; transform:rotate(0deg);
  left:180px; top:200px; z-index:1;
}
.mc-cup{
  width:290px; left:596px; top:504px; z-index:3; cursor:pointer;
}
.nov-text{
  width:240px; left:624px; top:600px; z-index:3;
}
.home-gif{
  width:140px; right:56px; top:40px; left:auto; z-index:3; cursor:pointer;
}

/* Q弹点击 */
.click-item{
  transform-style:preserve-3d;
  transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1), filter 0.35s ease;
  transform:translateZ(0);
  filter:drop-shadow(0 10px 18px rgba(0,0,0,0.18));
}
.click-item:active{
  transform:translateZ(40px) scale(1.08);
  filter:drop-shadow(0 18px 30px rgba(0,0,0,0.35));
}

/* 淡入转场 */
.fade-overlay{
  position:fixed; inset:0; background:#ffffff; z-index:9999;
  opacity:0; pointer-events:none; transition:opacity 0.32s ease-in-out;
}
.fade-overlay.active{ opacity:1; pointer-events:auto; }
</style>
</head>
<body>
<div class="fade-overlay" id="fadeOverlay"></div>

<div class="page">
  <div class="inner-canvas" id="canvas">
    <img class="oct-img" src="oct.webp" alt="标题">
    <div class="cake-wrap">
      <img class="cake click-item" src="ck.webp" alt="蛋糕" data-link="leehan3.html">
    </div>
    <img class="plate" src="pz.webp" alt="播放器">
    <img class="mc-cup click-item" src="mc.webp" alt="杯子" data-link="cup.html">
    <img class="nov-text" src="nov.webp" alt="nov文字">
    <img class="home-gif click-item" src="home.gif" alt="返回主页" data-link="leehan.html">
  </div>
</div>

<script>
// 自动计算缩放比例，让960*1707画布刚好填满外层page
function resizeCanvas(){
  const page = document.querySelector('.page');
  const canvas = document.getElementById('canvas');
  const scaleX = page.clientWidth / 960;
  const scaleY = page.clientHeight / 1707;
  canvas.style.transform = `scale(${scaleX}, ${scaleY})`;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// 跳转淡入
const overlay = document.getElementById('fadeOverlay');
const clickItems = document.querySelectorAll('.click-item');
clickItems.forEach(item => {
  item.addEventListener('click', function () {
    const targetUrl = this.dataset.link;
    overlay.classList.add('active');
    setTimeout(() => { location.href = targetUrl; }, 320);
  });
});

// ========== 音频模块 ==========
function triggerJelly(el, soft = false) {
  el.classList.remove('jelly', 'jelly-soft');
  void el.offsetWidth;
  el.classList.add(soft ? 'jelly-soft' : 'jelly');
}

const soundList = {
  g1: "onedoor.mp3",
  g2: "lp.mp3",
  g3: "woaini.mp3",
  noteImg: "hlo.mp3",
  snowBear: "na.mp3",
  title: "xsy.mp3",
  musicBox: "lon.mp3"
};
const loopBgIds = ["snowBear", "musicBox"];
const audioMap = {};
const playingState = {};

function getKey(id){
  return "bg_audio_" + id;
}

function saveBgState(id){
  if(!loopBgIds.includes(id)) return;
  const audio = audioMap[id];
  if(!audio) return;
  localStorage.setItem(getKey(id), JSON.stringify({
    currentTime: audio.currentTime,
    playing: playingState[id]
  }));
}

function restoreBg(id){
  const str = localStorage.getItem(getKey(id));
  if(!str) return;
  const data = JSON.parse(str);
  if(!audioMap[id]){
    const a = new Audio(soundList[id]);
    a.loop = true;
    audioMap[id] = a;
    playingState[id] = false;
  }
  const audio = audioMap[id];
  audio.addEventListener('loadedmetadata', ()=>{
    audio.currentTime = data.currentTime;
    if(data.playing){
      audio.play().catch(e=>{});
      playingState[id] = true;
    }
  }, {once:true});
}

function toggleSound(id){
  // 短音效：一次性播放，不存状态
  if(!loopBgIds.includes(id)){
    const s = new Audio(soundList[id]);
    s.play().catch(e=>{});
    return;
  }
  if(!audioMap[id]){
    const a = new Audio(soundList[id]);
    a.loop = true;
    audioMap[id] = a;
    playingState[id] = false;
  }
  const audio = audioMap[id];
  if(playingState[id]){
    audio.pause();
    playingState[id] = false;
  }else{
    audio.play().catch(e=>{});
    playingState[id] = true;
  }
  saveBgState(id);
}

setInterval(()=>{
  loopBgIds.forEach(id=>saveBgState(id));
},300);

// ✅ 合并onload！先缩放已经执行过了，这里只恢复音频
window.addEventListener('load', ()=>{
  loopBgIds.forEach(id=>restoreBg(id));
});
</script>
</body>
</html>
