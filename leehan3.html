<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Leehan · 小鱼的回信</title>
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/383/main/result.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#FFFFF0;
}
.page{
  position:relative;
  width:min(100vw, calc(100vh * 960 / 1707));
  aspect-ratio: 960 / 1707;
  background:url("xbg.png") no-repeat center;
  background-size:100% 100%;
  overflow:hidden;
}
.home-wrap{
  position:absolute;
  top:calc(1.2% - 5px);
  right:5.8%;
  width:14%;
  height:14%;
  cursor:pointer;
  transition: transform 0.15s ease;
}
.home-wrap:active{
  transform: scale(0.92);
}
.home-wrap img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
/* 小鱼回信标题往左移3px */
.title-text{
  position:absolute;
  top:calc(10% - 15px);
  left:calc(50% - 3px);
  transform: translateX(-50%);
  width:260px;
  color:#8b7976;
  font-size:24px;
  font-family: "MaoKenTangYuan", system-ui, serif;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  white-space: nowrap;
  justify-content:flex-start;
}
.play-tri{
  width:0;
  height:0;
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
  border-left: 16px solid #8b7976;
  flex-shrink:0;
}
.pause-line{
  display:flex;
  width:14px;
  height:16px;
  gap:4px;
  align-items:center;
  flex-shrink:0;
}
.pause-line span{
  width:4px;
  height:16px;
  background:#8b7976;
}
.seoul-box{
  position:absolute;
  top:calc(20% - 15px);
  left:calc(15.83% - 15px - 2px + 1px);
  width: max-content;
  min-width: 120px;
  aspect-ratio:3/1;
  height:auto;
  overflow:visible;
  border:none;
  border-radius:10px;
  background:#fffee8;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding: 3% 4%;
  transform-origin: left top;
  transform: scale(0.67);
}
/* 字体从18px → 19px，盒子会跟着自动撑开 */
.seoul-text{
  transform: scale(1/0.67);
  transform-origin: left top;
  white-space: nowrap;
  color:#8b7976;
  font-size:19px;
  font-family: "MaoKenTangYuan", system-ui, serif;
}
.box-static{
  position:absolute;
  width:20.2%;
  height:23.2%;
  cursor:pointer;
}
.box1{top:41%; left:2.2%;}
.box2{top:41%; left:24.3%;}
.box3{top:41%; left:46.4%;}
.box4{top:68.5%; left:68.5%;}
.calendar-container{
  position:absolute;
  left:0;
  bottom:calc(1.5% + 2px + 3px);
  width:100%;
  height:22%;
  overflow:hidden;
  touch-action: pan-x;
}
.calendar-track{
  display:flex;
  gap:2.5%;
  height:100%;
  padding-left:3.1%;
  align-items:center;
  transition: transform 0.35s ease-out;
}
.calendar-item{
  width:18%;
  aspect-ratio: 3 / 4;
  flex-shrink:0;
  border:2px solid #cfbcb5;
  border-radius:8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#705c46;
  font-family: "MaoKenTangYuan", system-ui, serif;
  cursor:pointer;
  background:rgba(255,255,255,0.3);
  user-select:none;
  transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
}
.calendar-item:active{
  transform: scale(0.92);
}
.calendar-item.active{
  border-color:#cfbcb5;
  background:#cfbcb5;
  color:#fcfaeb;
  box-shadow:0 0 8px #705c4660;
}
.calendar-item .day-num{
  font-size:22px;
  line-height:1;
}
.calendar-item .week-text{
  font-size:9px;
  margin-top:4px;
}
.schedule-wrap{
  position:absolute;
  top:calc(26.34% + 15px);
  left:calc(15.83% - 15px);
  width:calc(100% - 15.83% - 12% - 20px);
  aspect-ratio:7 / 3;
  border:none;
  border-radius:10px;
  background:#fffee8;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding: 2% 3%;
}
.schedule-text{
  width:100%;
  color:#8b7976;
  font-size:11px;
  font-family: "MaoKenTangYuan", system-ui, serif;
  line-height:1.6;
  text-align:left;
}
.note-text{
  position:absolute;
  left:50%;
  top:calc(36% + 23px + 30px + 15px + 5px + 5px + 10px + 8px);
  transform: translateX(-50%);
  color:#8b7976;
  font-family: "MaoKenTangYuan", system-ui, serif;
  font-size:8px;
  white-space:nowrap;
}

.num-wrap{
  position:absolute;
  top:calc(42% + 56px + 3px + 6px + 12px + 10px + 5px + 10px + 10px);
  left:0;
  right:0;
  width:100%;
  display:flex;
  justify-content: space-evenly;
  align-items:flex-start;
}
.num-item{
  width:17%;
  aspect-ratio:17 / 24;
  align-self:flex-start;
  min-height:0;
  background:#cfbcb5;
  border-radius:8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:12px 6px;
  gap:10px;
  color:#fcfaeb;
  transform: scale(1.25);
  transform-origin: center;
}
.num-text{
  font-family: "MaoKenTangYuan", system-ui, serif;
  font-size:21px;
  line-height:1;
}
.num-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  transform: scale(0.85);
  transform-origin: center;
}
</style>
</head>
<body>
<div class="page">
  <div class="title-text" id="titleWrap">
    <div class="play-tri" id="playIcon"></div>
    <div class="pause-line" id="pauseIcon">
      <span></span>
      <span></span>
    </div>
    <span id="titleWord">小鱼的回信</span>
  </div>

  <div class="seoul-box">
    <div class="seoul-text" id="cityText">小鱼去哪了📍首尔 Seoul</div>
  </div>

  <div class="home-wrap" id="homeBtn">
    <img src="home.gif" alt="返回主页">
  </div>

  <div class="box-static box1" id="box1"></div>
  <div class="box-static box2" id="box2"></div>
  <div class="box-static box3" id="box3"></div>
  <div class="box-static box4" id="box4"></div>

  <div class="schedule-wrap">
    <div class="schedule-text" id="scheduleBox"></div>
  </div>

  <div class="note-text">dm人工记录 欢迎指出错误</div>

  <div class="num-wrap">
    <div class="num-item">
      <div class="num-text" id="n1">86</div>
      <div class="num-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      </div>
    </div>
    <div class="num-item">
      <div class="num-text" id="n2">10</div>
      <div class="num-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </div>
    </div>
    <div class="num-item">
      <div class="num-text" id="n3">0</div>
      <div class="num-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="5" width="15" height="14" rx="2"/>
          <path d="m23 7-7 5 7 5z"/>
        </svg>
      </div>
    </div>
    <div class="num-item">
      <div class="num-text" id="n4">0</div>
      <div class="num-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="calendar-container" id="calendarContainer">
    <div class="calendar-track" id="calendarTrack"></div>
  </div>
</div>

<script>
const numList = [
  "86 10 0 0",
  "64 3 0 0",
  "65 6 0 0",
  "31 7 0 0",
  "41 1 0 0",
  "48 1 0 0",
  "11 3 0 0",
  "46 4 0 0",
  "36 0 0 0",
  "20 4 0 0",
  "11 2 0 0",
  "24 1 0 0",
  "76 1 0 0",
  "11 2 0 0",
  "24 1 0 0",
  "91 3 1 0",
  "9 1 0 0",
  "50 1 0 0",
  "8 3 0 0",
  "35 0 0 0",
  "7 2 0 0",
  "2 0 0 0",
  "13 0 0 0",
  "7 0 0 0",
  "67 1 0 0",
  "14 1 0 0",
  "93 1 0 0",
  "31 1 0 0",
  "5 1 0 0",
  "7 0 0 0",
  "14 2 0 0"
];

const dayData = [
  {text:"M COUNTDOWN ANIMAL初舞台"},
  {text:"261002 M2U签售"},
  {text:"BOYNEXTDOOR 1st Studio Album Repackage 'ANIMAL' MV Behind Sketch<br>MA签售"},
  {text:"SBS 人气歌谣（特别MC）"},
  {text:"BOYNEXTDOOR [HOME: DELUXE] Concept Photo Behind Sketch"},
  {text:"KBS 不朽的名曲 景福宫公演"},
  {text:"Anima MV Reaction"},
  {text:"v+音乐中心<br>M COUNTDOWN ANIMAL舞台（一位获奖）<br>yzy线上签售"},
  {text:"GMP 出发首尔 KNOCK ON Vol.2"},
  {text:"首尔 KNOCK ON Vol.2 d1"},
  {text:"首尔 KNOCK ON Vol.2 d2"},
  {text:"HDN返程<br>后续专录音Behind"},
  {text:"KBS开放音乐会"},
  {text:"BEHINDOOR"},
  {text:"M COUNTDOWN 《Count To Love》舞台<br>SW签售"},
  {text:"KBS 音乐银行 《Count To Love》<br>DAM BALANCED<br>微博直播"},
  {text:"mini FM<br>wvs live"},
  {text:"BOYNEXTDOOR’s WEGO 2026 Autumn/Winter Visual Shoot Behind<br>yzy线上签售"},
  {text:"Guinea Pig with me LEEHAN'S DAY<br>Home Party"},
  {text:"wvs live 生日直播"},
  {text:"BBNEXDO in Sweet Dreams - 专属留言"},
  {text:"无行程"},
  {text:"BND in USJ"},
  {text:"ICN出发<br>yzy北京 Beijing签售d1"},
  {text:"yzy北京 Beijing签售d2"},
  {text:"ICN出发<br>LAX到达洛杉矶 Los Angeles"},
  {text:"LAX停留洛杉矶 Los Angeles"},
  {text:"洛杉矶 Los Angeles 休整"},
  {text:"达拉斯 Dallas 第一场"},
  {text:"达拉斯 Dallas 第二场"},
  {text:"达拉斯 Dallas 收尾"}
];

// 根据日期获取城市文字
function getCityText(dayNum){
  if(dayNum === 11 || dayNum === 12){
    return "小鱼去哪了📍千叶 Chiba";
  }else if(dayNum === 24 || dayNum === 25){
    return "小鱼去哪了📍北京 Beijing";
  }else if(dayNum >=26 && dayNum <=28){
    return "小鱼去哪了📍洛杉矶 Los Angeles";
  }else if(dayNum >=29 && dayNum <=31){
    return "小鱼去哪了📍达拉斯 Dallas";
  }else{
    return "小鱼去哪了📍首尔 Seoul";
  }
}

let currentIndex = 0;
const weekArr = ["星期四","星期五","星期六","星期日","星期一","星期二","星期三"];

const track = document.getElementById("calendarTrack");
const container = document.getElementById("calendarContainer");
const scheduleBox = document.getElementById("scheduleBox");
const cityTextDom = document.getElementById("cityText");

const titleWrap = document.getElementById("titleWrap");
const playIcon = document.getElementById("playIcon");
const pauseIcon = document.getElementById("pauseIcon");
const titleWord = document.getElementById("titleWord");

let isPlaying = false;
let playTimer = null;
const playSpeed = 1500;

playIcon.style.display = "block";
pauseIcon.style.display = "none";
titleWord.innerText = "小鱼的回信";

function setPlayUI(playState){
  isPlaying = playState;
  if(isPlaying){
    playIcon.style.display = "none";
    pauseIcon.style.display = "flex";
    titleWord.innerText = "观看小鱼回信中";
  }else{
    playIcon.style.display = "block";
    pauseIcon.style.display = "none";
    titleWord.innerText = "小鱼的回信";
  }
}

function startAutoPlay(){
  if(playTimer) clearInterval(playTimer);
  setPlayUI(true);
  playTimer = setInterval(()=>{
    let next = currentIndex + 1;
    if(next >= dayData.length){
      selectDay(0);
      stopAutoPlay();
      return;
    }
    selectDay(next);
  }, playSpeed);
}

function stopAutoPlay(){
  if(playTimer) clearInterval(playTimer);
  playTimer = null;
  setPlayUI(false);
}

titleWrap.onclick = ()=>{
  if(isPlaying){
    stopAutoPlay();
  }else{
    startAutoPlay();
  }
};

document.getElementById("homeBtn").onclick = ()=>{
  location.href='leehan.html';
};
document.getElementById("box1").onclick = ()=>{};
document.getElementById("box2").onclick = ()=>{};
document.getElementById("box3").onclick = ()=>{};
document.getElementById("box4").onclick = ()=>{};

let isDrag = false;
let startX = 0;
let startTranslate = 0;
let currentTranslate = 0;
let isHorizontal = null;

function updateActive(){
  const items = track.querySelectorAll(".calendar-item");
  items.forEach((el,i)=>{
    if(i === currentIndex) el.classList.add("active");
    else el.classList.remove("active");
  })
}

function renderCalendar(){
  track.innerHTML = "";
  for(let i=0; i<dayData.length; i++){
    const div = document.createElement("div");
    div.className = "calendar-item";
    const dayNum = i+1;
    const w = weekArr[i % 7];
    div.innerHTML = `
      <div class="day-num">${dayNum}</div>
      <div class="week-text">${w}</div>
    `;
    div.onclick = ()=>{
      stopAutoPlay();
      selectDay(i);
    };
    track.appendChild(div);
  }
  updateActive();
}

function updateView(idx){
  const dayNum = idx + 1;
  const info = dayData[idx];
  scheduleBox.innerHTML = info.text;
  cityTextDom.innerText = getCityText(dayNum);

  const parts = numList[idx].split(" ");
  document.getElementById("n1").innerText = parts[0];
  document.getElementById("n2").innerText = parts[1];
  document.getElementById("n3").innerText = parts[2];
  document.getElementById("n4").innerText = parts[3];
  updateActive();

  const items = track.querySelectorAll(".calendar-item");
  const item = items[idx];
  const containerW = container.offsetWidth;
  const itemW = item.offsetWidth;
  const itemLeft = item.offsetLeft;
  const targetX = containerW / 2 - (itemLeft + itemW / 2);

  currentTranslate = targetX;
  track.style.transform = `translateX(${currentTranslate}px)`;
}

function selectDay(idx){
  currentIndex = idx;
  updateView(currentIndex);
}

track.addEventListener("mousedown", (e)=>{
  isDrag = true;
  startX = e.clientX;
  startTranslate = currentTranslate;
  track.style.transition = "none";
})
document.addEventListener("mousemove", (e)=>{
  if(!isDrag) return;
  const dx = e.clientX - startX;
  currentTranslate = startTranslate + dx;
  track.style.transform = `translateX(${currentTranslate}px)`;
})
document.addEventListener("mouseup", ()=>{
  if(!isDrag) return;
  isDrag = false;
  track.style.transition = "transform 0.35s ease-out";
  const items = track.querySelectorAll(".calendar-item");
  let targetIdx = 0;
  let minDist = Infinity;
  items.forEach((it, i)=>{
    const itemCenter = it.offsetLeft + it.offsetWidth/2;
    const viewCenter = -currentTranslate + container.offsetWidth/2;
    const d = Math.abs(itemCenter - viewCenter);
    if(d < minDist){
      minDist = d;
      targetIdx = i;
    }
  })
  selectDay(targetIdx);
  stopAutoPlay();
})

track.addEventListener("touchstart", (e)=>{
  isDrag = true;
  const touch = e.touches[0];
  startX = touch.clientX;
  startTranslate = currentTranslate;
  isHorizontal = null;
  track.style.transition = "none";
})
track.addEventListener("touchmove", (e)=>{
  if(!isDrag) return;
  const touch = e.touches[0];
  const dx = touch.clientX - startX;
  const dy = touch.clientY - startY;
  if(isHorizontal === null){
    isHorizontal = Math.abs(dx) > Math.abs(dy);
  }
  if(isHorizontal){
    e.preventDefault();
    currentTranslate = startTranslate + dx;
    track.style.transform = `translateX(${currentTranslate}px)`;
  }
},{passive:false})

function touchEndHandler(){
  if(!isDrag) return;
  isDrag = false;
  track.style.transition = "transform 0.35s ease-out";
  const items = track.querySelectorAll(".calendar-item");
  let targetIdx = 0;
  let minDist = Infinity;
  items.forEach((it, i)=>{
    const itemCenter = it.offsetLeft + it.offsetWidth/2;
    const viewCenter = -currentTranslate + container.offsetWidth/2;
    const d = Math.abs(itemCenter - viewCenter);
    if(d < minDist){
      minDist = d;
      targetIdx = i;
    }
  })
  selectDay(targetIdx);
  stopAutoPlay();
}
track.addEventListener("touchend", touchEndHandler);
track.addEventListener("touchcancel", touchEndHandler);

renderCalendar();
updateView(currentIndex);
</script>
</body>
</html>
